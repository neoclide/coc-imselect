name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify native input selector
        run: |
          test -x bin/select
          file bin/select
          ./bin/select
